name: Build Release APK

# No secrets or variables needed. Signed with the fixed key ci-release.p12 in the repo.
# Run it from the Actions tab, or push a tag like v5.8.9 to also get a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # The server the release app talks to. Change this one line if needed
  # (must be https://..., or the exact http address already allowed in build.gradle.kts).
  API_BASE_URL: "http://185.26.33.188:8080/"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-35
            platforms;android-37.0
            build-tools;35.0.0
            cmake;3.22.1

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        env:
          # Fixed key committed as ci-release.p12: every build is signed the same,
          # so a new APK installs over the old one as an update.
          PINBOM_STORE_FILE: ci-release.p12
          PINBOM_STORE_PASSWORD: pinbom-ci
          PINBOM_KEY_ALIAS: pinbom
          PINBOM_KEY_PASSWORD: pinbom-ci
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease -PPINBOM_API_BASE_URL="$API_BASE_URL" --no-daemon --stacktrace

      - name: Rename APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          mkdir -p dist
          cp "$(find app/build/outputs/apk/release -name '*.apk' | head -1)" "dist/PinBom-${VERSION}.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: PinBom-release-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
